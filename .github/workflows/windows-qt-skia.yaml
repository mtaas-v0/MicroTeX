name: Windows Qt / SKIA

on: 
  - workflow_dispatch
#  - push
  - pull_request

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: 
        os: 
          - windows-2022
        include:
          - qt_ver: 5.15.2
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
            qt_arch_install: win64_msvc2019_64
          - qt_ver: 6.0.0
            qt_arch: win64_msvc2019_64
            msvc_arch: x64
            qt_arch_install: win64_msvc2019_64
    steps:
    - name: Downloading Source Code 📥
      uses: actions/checkout@v2
      
    - name: Swap to Skia Manifest for CI
      run: Copy-Item -Path "vcpkg-ci-skia.json" -Destination "vcpkg.json" -Force

    # Step 1: Cache vcpkg artifacts (Keep your existing step)
    - name: Cache vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: ${{ runner.os }}-vcpkg-skia-${{ hashFiles('vcpkg.json') }}
        restore-keys: ${{ runner.os }}-vcpkg-skia-

    # Step 2: NEW - Cache the CMake / Meson Build Directory
    - name: Cache CMake Build Directory
      id: cache-cmake
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build
        # Invalidate the cache if your build scripts or dependencies change
        key: ${{ runner.os }}-cmake-build-${{ hashFiles('CMakeLists.txt', 'meson.build', 'vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-cmake-build-

    - name: Downloading CMake 📥
      # Install latest CMake.
      uses: lukka/get-cmake@latest
    - name: Downloading Vcpkg 📥
      run: |
        cd ${{ github.workspace }}
        mkdir build -force
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        .\bootstrap-vcpkg.bat
    - name: Setup Environment (x64)
      uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
      with:
        arch: x64

    # Step 4: Install Skia (Will hit cache if key matches)
    - name: Install Skia via vcpkg
      if: false #using vcpkg-ci-skia.json
      run: |
        vcpkg install skia:x64-windows
      shell: bash
      
    - name: Downloading Qt 📥
    #v2 has py7zr build from src then crash at _PyLong_AsInt api not longer exposed in py313 or above
    #v3 has a problem [qt_base] not parsed from xml
      uses: jurplel/install-qt-action@v4
      with:
          # Version of Qt to install
        version: ${{ matrix.qt_ver }}
          # Target platform for build
          # target: ${{ matrix.qt_target }}
        arch: ${{ matrix.qt_arch }}
        aqtversion: '==3.3.0' # Forces the use of the latest fixed parser engine
        cache: true        
#        cached: 'false'

        # Qt Off due to logic in CMakeList.txt, actually it will be Qt+Skia
    - name: Configure 🔧
      if: steps.cache-cmake.outputs.cache-hit != 'true'
      run: |
        cd ${{ github.workspace }}
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DSKIA=ON -DQT=OFF -DCMAKE_BUILD_TYPE=Release -G Ninja
    - name: Compile 🎲
      run: |
        cd ${{ github.workspace }}
        cd build
        ninja

    - name: Package Qt DLLs (Windows)
      run: |
        # 1. Locate windeployqt using the environment variable set by the Qt action
        echo "Using Qt path: $env:Qt6_DIR"
        
        # 2. Run windeployqt pointing to your compiled executable
        # Replace 'builddir/your_app.exe' with your actual executable path
        windeployqt --no-compiler-runtime build/LaTeX.exe
      shell: pwsh

    - name: Upload Failure Artifact
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: failure-build-dir-qt-skia-r${{ github.run_number }}
        path: .
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-qt-skia-r${{ github.run_number }}
        path: build
